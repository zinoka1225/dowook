<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도욱</title>
<meta name="description" content="교육, 디자인, 글, 노래. 김도욱의 웹.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 로고는 한 번만 정의하고 <use href="#logo">로 불러 쓴다 -->
<svg class="sprite" aria-hidden="true">
  <defs>
    <clipPath id="logo-clip"><rect x="591" y="291" width="2319" height="1832"/></clipPath>
  </defs>
  <!-- 큰 로고: Noto Sans KR Light -->
  <symbol id="logo" viewBox="0 0 3415 2519">
    <rect width="3415" height="2519" fill="#000"/>
    <rect x="591" y="291" width="2319" height="1832" fill="#fff"/>
    <path clip-path="url(#logo-clip)" fill="#000" d="M821.7 1044.1H1674V1107.7H821.7ZM669 1465.3H1812.6V1530.4H669ZM1200.5 1069.6H1275.4V1497.8H1200.5ZM821.7 548H1659.9V613H896.6V1072.4H821.7Z M2502.4 1096.4H2575.9V1329.6H2502.4ZM1969.5 1063.9H3107.3V1127.5H1969.5ZM2096.7 1300H2964.6V1698.6H2889.7V1363.6H2096.7ZM2537.7 470.2Q2673.4 470.2 2770.2 499.2Q2867 528.2 2920.7 581.2Q2974.5 634.2 2974.5 710.5Q2974.5 785.4 2920.7 838.4Q2867 891.4 2770.2 919.7Q2673.4 948 2537.7 948Q2404.8 948 2307.3 919.7Q2209.8 891.4 2156 838.4Q2102.3 785.4 2102.3 710.5Q2102.3 634.2 2156 581.2Q2209.8 528.2 2307.3 499.2Q2404.8 470.2 2537.7 470.2ZM2537.7 533.8Q2430.3 533.8 2349.7 555Q2269.1 576.2 2224.6 615.8Q2180.1 655.4 2180.1 710.5Q2180.1 764.2 2224.6 803.8Q2269.1 843.4 2349.7 864.6Q2430.3 885.8 2537.7 885.8Q2646.5 885.8 2727.1 864.6Q2807.7 843.4 2852.2 803.8Q2896.7 764.2 2896.7 710.5Q2896.7 655.4 2852.2 615.8Q2807.7 576.2 2727.1 555Q2646.5 533.8 2537.7 533.8Z"/>
  </symbol>
  <!-- 작은 로고(하위 페이지 왼쪽 위): 같은 자리·크기에 Medium 굵기 (Noto Sans KR Medium) -->
  <symbol id="logo-medium" viewBox="0 0 3415 2519">
    <rect width="3415" height="2519" fill="#000"/>
    <rect x="591" y="291" width="2319" height="1832" fill="#fff"/>
    <path clip-path="url(#logo-clip)" fill="#000" d="M799.1 1014.4H1695.3V1133.1H799.1ZM656.3 1438.5H1826.7V1560H656.3ZM1165.2 1066.7H1313.6V1480.9H1165.2ZM799.1 519.7H1684V639.8H947.5V1066.7H799.1Z M2465.6 1117.7H2612.6V1328.3H2465.6ZM1956.7 1041.3H3124.3V1160.1H1956.7ZM2085.4 1295.8H2981.5V1715.6H2833.1V1413.1H2085.4ZM2540.5 450.5Q2680.5 450.5 2783.6 480.9Q2886.8 511.3 2943.4 567.8Q2999.9 624.3 2999.9 703.5Q2999.9 781.2 2943.4 837.8Q2886.8 894.3 2783.6 924.7Q2680.5 955.1 2540.5 955.1Q2400.6 955.1 2296.7 924.7Q2192.8 894.3 2136.3 837.8Q2079.7 781.2 2079.7 703.5Q2079.7 624.3 2136.3 567.8Q2192.8 511.3 2296.7 480.9Q2400.6 450.5 2540.5 450.5ZM2540.5 567.8Q2444.4 567.8 2375.1 583.4Q2305.9 598.9 2269.1 628.6Q2232.4 658.3 2232.4 703.5Q2232.4 747.3 2269.1 777.7Q2305.9 808.1 2375.1 823.7Q2444.4 839.2 2540.5 839.2Q2636.6 839.2 2705.2 823.7Q2773.7 808.1 2810.5 777.7Q2847.2 747.3 2847.2 703.5Q2847.2 658.3 2810.5 628.6Q2773.7 598.9 2705.2 583.4Q2636.6 567.8 2540.5 567.8Z"/>
  </symbol>
</svg>

<main>
  <!-- 첫 화면 -->
  <section class="view view--home" data-view="home" aria-label="첫 화면">
    <div class="stage" id="stage">
      <div class="ring" id="ring" aria-hidden="true"></div>
      <p class="hint">원이 주제를 포함할 때<br>도욱을 누르세요.</p>
      <ul class="orbit" id="orbit" aria-label="주제">
        <li data-target="email"><span>전자우편</span><span>email</span></li>
        <li data-target="design"><span>디자인</span><span>design</span></li>
        <li data-target="education"><span>교육</span><span>education</span></li>
        <li data-target="singing"><span>노래</span><span>singing</span></li>
      </ul>
      <div class="core">
        <button class="logo" id="core-logo" type="button" aria-label="도욱. 원 안에 주제가 들어왔을 때 누르면 그 주제로 이동합니다.">
          <svg class="logo-mark" aria-hidden="true"><use href="#logo"/></svg>
        </button>
      </div>
      <p class="updated" id="updated">
        <small><span>최근 업데이트</span><span>Last updated</span></small>
        <time id="updated-date"></time>
      </p>
    </div>
  </section>

  <!-- 디자인 -->
  <section class="view" data-view="design" hidden>
    <div class="page">
      <a class="home-link" href="#home" aria-label="처음으로"><svg class="logo-mark" aria-hidden="true"><use href="#logo-medium"/></svg></a>
      <header class="page-head">
        <h1 class="page-title"><span>디자인</span><span>design</span></h1>
        <p class="page-intro" data-edit="intro.design"></p>
      </header>
      <div class="page-body works" id="works"></div>
    </div>
  </section>

  <!-- 디자인: 작업 하나 (목록에서 누르면 열린다) -->
  <section class="view" data-view="work" hidden>
    <div class="page">
      <a class="home-link" href="#home" aria-label="처음으로"><svg class="logo-mark" aria-hidden="true"><use href="#logo-medium"/></svg></a>
      <article class="work-detail" id="work"></article>
    </div>
  </section>

  <!-- 교육 -->
  <section class="view" data-view="education" hidden>
    <div class="page">
      <a class="home-link" href="#home" aria-label="처음으로"><svg class="logo-mark" aria-hidden="true"><use href="#logo-medium"/></svg></a>
      <header class="page-head">
        <h1 class="page-title"><span>교육</span><span>education</span></h1>
        <p class="page-intro" data-edit="intro.education"></p>
      </header>
      <div class="page-body lessons" id="classes"></div>
    </div>
  </section>

  <!-- 교육: 수업 하나 (목록에서 누르면 열린다) -->
  <section class="view" data-view="lesson" hidden>
    <div class="page">
      <a class="home-link" href="#home" aria-label="처음으로"><svg class="logo-mark" aria-hidden="true"><use href="#logo-medium"/></svg></a>
      <article class="lesson" id="lesson"></article>
    </div>
  </section>

  <!-- 노래 -->
  <section class="view" data-view="singing" hidden>
    <div class="page">
      <a class="home-link" href="#home" aria-label="처음으로"><svg class="logo-mark" aria-hidden="true"><use href="#logo-medium"/></svg></a>
      <header class="page-head">
        <h1 class="page-title"><span>노래</span><span>singing</span></h1>
        <p class="page-intro" data-edit="intro.singing"></p>
      </header>
      <ul class="page-body rows songs" id="songs"></ul>
    </div>
  </section>

  <!-- 전자우편 -->
  <section class="view" data-view="email" hidden>
    <div class="page">
      <a class="home-link" href="#home" aria-label="처음으로"><svg class="logo-mark" aria-hidden="true"><use href="#logo-medium"/></svg></a>
      <header class="page-head">
        <h1 class="page-title"><span>전자우편</span><span>email</span></h1>
      </header>
      <p class="page-body mail"><a class="big u-line" id="mail-link" href="#email">메일 주소</a></p>
    </div>
  </section>

  <!-- 불안 (이스터에그: 최근 업데이트를 빠르게 5번 누르면 열린다) -->
  <section class="view view--anxiety" data-view="anxiety" hidden>
    <div class="anxiety-hero">
      <div class="anxiety">
        <h1 class="page-title"><span>불안</span><span>anxiety</span></h1>
        <a class="logo-link" href="#home" aria-label="처음으로"><svg class="logo-mark" aria-hidden="true"><use href="#logo"/></svg></a>
        <p data-edit="intro.anxiety"></p>
      </div>
    </div>
  </section>
</main>

<script src="content/data.js"></script>
<script src="script.js"></script>
</body>
</html>
